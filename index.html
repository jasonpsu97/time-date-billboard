<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Current Time and Date</title>
  <style>
    :root {
      --pulse-speed: 5s; /* adjust: 2s = fast flicker, 6s = slow breathing */
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #333; /* gray outside display */
      font-family: Arial, sans-serif;
      color: #fff;
    }

    #clock-app {
      width: 288px;
      height: 144px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
      border-radius: 20px;
      text-align: center;
      position: relative;
      overflow: hidden;

      background: url("background.webp") center center no-repeat;
      background-size: 100% 100%;

      /* Inset neon blue glow with animation */
      animation: pulseGlow var(--pulse-speed) infinite alternate;
    }

    @keyframes pulseGlow {
      0% {
        box-shadow:
          inset 0 0 5px rgba(255, 0, 0, 0.3),
          inset 0 0 15px rgba(255, 0, 0, 0.2),
          inset 0 0 25px rgba(255, 0, 0, 0.1); /* fixed typo */
      }
      100% {
        box-shadow:
          inset 0 0 15px rgba(255, 0, 0, 1),
          inset 0 0 35px rgba(255, 0, 0, 0.9),
          inset 0 0 70px rgba(255, 0, 0, 0.8);
      }
    }

    .text-box {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 8px;
      padding: 6px 12px;
    }

    @supports not ((backdrop-filter: blur(8px)) or (-webkit-backdrop-filter: blur(8px))) {
      .text-box { background: rgba(0,0,0,0.45); }
    }

    #day, #date {
      font-size: 26px;
      font-family: Arial, sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      margin: 2px 0;
    }

    #time {
      font-size: 40px;
      font-family: Arial, sans-serif;
      margin: 4px 0;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div id="clock-app">
    <div class="text-box">
      <div id="day">Loading...</div>
      <div id="time"></div>
      <div id="date"></div>
    </div>
  </div>

  <script>
    // Formatter for Eastern Time
    const fmt = new Intl.DateTimeFormat('en-US', {
      timeZone: 'America/New_York',
      weekday: 'long',
      month: 'long',
      day: 'numeric',
      year: 'numeric',
      hour: 'numeric',
      minute: '2-digit',
      hour12: true
    });

    function renderET() {
      const parts = Object.fromEntries(fmt.formatToParts(new Date()).map(p => [p.type, p.value]));

      const day = (parts.weekday || '').toUpperCase();
      const time = `${parts.hour}:${parts.minute} ${parts.dayPeriod}`;
      const date = `${parts.month} ${parts.day}, ${parts.year}`.toUpperCase();

      document.getElementById('day').textContent = day;
      document.getElementById('time').textContent = time;
      document.getElementById('date').textContent = date;
    }

    function tick() {
      renderET();
      const delay = 1000 - (Date.now() % 1000); // align updates to the real second
      setTimeout(tick, delay);
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) renderET(); // snap back if tab regains focus
    });

    tick();
  </script>
</body>
</html>
