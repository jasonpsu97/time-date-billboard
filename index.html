<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Current Time and Date</title>
  <style>
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
    }

    #clock-app {
      width: 288px;
      height: 144px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 8px;
      border-radius: 10px;
      text-align: center;
      background: url("background.webp") no-repeat center center;
      background-size: cover;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .text-box {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 5px 10px;
      border-radius: 5px;
    }

    #day, #date {
      font-size: 26px;
      font-weight: bold;
      text-transform: uppercase;
      margin: 2px 0;
    }

    #time {
      font-size: 40px;
      margin: 4px 0;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="clock-app">
    <div class="text-box">
      <div id="day">Loading...</div>
      <div id="time"></div>
      <div id="date"></div>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();

      const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      const months = [
        'January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'
      ];

      const day = days[now.getDay()];
      const monthName = months[now.getMonth()];
      const date = now.getDate();
      const year = now.getFullYear();

      let hours = now.getHours();
      const minutes = now.getMinutes().toString().padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;

      const time = `${hours}:${minutes} ${ampm}`;
      const dateString = `${monthName} ${date}, ${year}`;

      document.getElementById('day').textContent = day.toUpperCase();
      document.getElementById('time').textContent = time;
      document.getElementById('date').textContent = dateString.toUpperCase();
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
