<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Current Time and Date</title>
  <style>
    :root {
      --pulse-speed: 5s; /* adjust: 2s = fast flicker, 6s = slow breathing */
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #333; /* gray outside display */
      font-family: Arial, sans-serif;
      color: #fff;
    }

    #clock-app {
      width: 288px;
      height: 144px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
      border-radius: 20px;
      text-align: center;
      position: relative;
      overflow: hidden;

      background: url("background.webp") center center no-repeat;
      background-size: 100% 100%;

      /* Inset neon red glow with animation */
      animation: pulseGlow var(--pulse-speed) infinite alternate;
    }

    @keyframes pulseGlow {
      0% {
        box-shadow:
          inset 0 0 5px rgba(0, 0, 255, 0.3),
          inset 0 0 15px rgba(0, 0, 255, 0.2),
          inset 0 0 25px rgba(, 0, 255, 0.1);
      }
      100% {
        box-shadow:
          inset 0 0 15px rgba(0, 0, 255, 1),
          inset 0 0 35px rgba(0, 0, 255, 0.9),
          inset 0 0 70px rgba(0, 0, 255, 0.8);
      }
    }

    .text-box {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 8px;
      padding: 6px 12px;
    }

    @supports not ((backdrop-filter: blur(8px)) or (-webkit-backdrop-filter: blur(8px))) {
      .text-box { background: rgba(0,0,0,0.45); }
    }

    #day, #date {
      font-size: 26px;
      font-family: Arial, sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      margin: 2px 0;
    }

    #time {
      font-size: 40px;
      font-family: Arial, sans-serif;
      margin: 4px 0;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div id="clock-app">
    <div class="text-box">
      <div id="day">Loading...</div>
      <div id="time"></div>
      <div id="date"></div>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const months = ['January','February','March','April','May','June',
                      'July','August','September','October','November','December'];

      const day = days[now.getDay()];
      const monthName = months[now.getMonth()];
      const date = now.getDate();
      const year = now.getFullYear();

      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2,'0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;

      document.getElementById('day').textContent = day.toUpperCase();
      document.getElementById('time').textContent = `${hours}:${minutes} ${ampm}`;
      document.getElementById('date').textContent = `${monthName} ${date}, ${year}`.toUpperCase();
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
